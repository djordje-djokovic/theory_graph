# Guard-rail tests (empty run, duplicate init).
experiment:
  run_id: _synthetic_guard
  corpus: startup_battlefield
  prompt_version: v2_1_0_premises
  sample: smoke_n3
  design: nested

passes:
  - name: premises
    prompt_version: v2_1_0_premises
    k_runs: 3

llm:
  model: "synthetic/fixture"
  temperature: 0.0
  max_tokens: 1000
  timeout_s: 30


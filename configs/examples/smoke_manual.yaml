# Smoke: no API. init builds messages; you place JSON then measure/analyze.
# Pass A only (premises).
experiment:
  run_id: v2_1_0_manual_smoke   # -> experiments/<run_id>/; bump when anything changes
  corpus: startup_battlefield   # data/corpora/<corpus>/
  prompt_version: v2_1_0_premises # prompts/v2_1_0_premises.md
  sample: smoke_n20             # samples/smoke_n20.csv
  design: nested                # nested | crossed (provenance label)

passes:
  - name: premises
    prompt_version: v2_1_0_premises
    k_runs: 3

llm:
  model: "manual/none"          # placeholder; unused when backend is manual
  temperature: 0.0
  max_tokens: 1000
  timeout_s: 30
encoding:
  backend: manual               # write encodings/premises/run{k}/{case_id}.json yourself
  k_runs: 3                     # expected run folders run1..run3
  json_retry: 0                 # N/A for manual
  run_passes: [premises]

dataset:
  outcome: GotSelected
  similarities:
    enabled: true
    method: tfidf
  embeddings:
    enabled: false

analysis:
  preset: battlefield
  outcome: GotSelected

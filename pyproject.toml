[project]
name = "theory-graph"
version = "0.1.0"
description = "Encode entrepreneurial theories as graphs (P->D->V) and analyze architecture measures"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "litellm>=1.40",
  "httpx>=0.27",
  "scikit-learn>=1.4",
]

[project.scripts]
theory-graph = "theory_graph.cli:main"

[tool.setuptools.packages.find]
where = ["toolkit"]

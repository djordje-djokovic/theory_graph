[project]
name = "theory-encoding-lab"
version = "0.1.0"
description = "Standalone lab for entrepreneurial theory architecture encoding experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "litellm>=1.40",
  "httpx>=0.27",
]

[project.scripts]
theory-lab = "theory_lab.cli:main"

[tool.setuptools.packages.find]
where = ["toolkit"]
